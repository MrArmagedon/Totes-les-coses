<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./script.js"></script>
    <link rel="stylesheet" href="./style.css">
    <title>Calculadora de Merda</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Protest+Strike&display=swap');
    </style>
</head>

<body>
    <h1 class="font-tope-guapa">CALCULADORA</h1>

    <input type="text" id="pantalla">

    <button onclick="num2()" id="blanc" class="font-tope-guapa">2</button>

    <button onclick="arrel3()" id="gris" class="font-tope-guapa">∛</button>
    <br><br>
    <button onclick="cos()" id="gris" class="font-tope-guapa">cos</button>
    <button onclick="num0()" id="blanc" class="font-tope-guapa">0</button>
    <button onclick="numE()" id="gris" class="font-tope-guapa">e</button>
    <button onclick="numPI()" id="gris" class="font-tope-guapa">π</button>
    <br><br>
    <button onclick="ln()" id="gris" class="font-tope-guapa">ln</button>
    <button onclick="elev2()" id="gris" class="font-tope-guapa">^</button>
    <button onclick="elev3()" id="gris" class="font-tope-guapa">^³</button>
    <br><br>
    <button onclick="restart()" id="vermell" class="font-tope-guapa">Reinicia</button>
